name: Apply Adhan Selection Support

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_adhan_selection.py'
      - 'lib/services/notification_service.dart'
      - 'lib/screens/settings_screen.dart'
      - 'pubspec.yaml'
      - 'assets/adhan/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply adhan selection support
        run: python scripts/apply_adhan_selection.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml lib/screens/settings_screen.dart lib/services/notification_service.dart android/app/src/main/res/raw/.gitkeep
          git commit -m 'feat: apply selectable adhan support'
          git push
