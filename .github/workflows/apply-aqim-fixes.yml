name: Apply Aqim requested fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Weekly card: show weekday names and Monday-Sunday dates.
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text(encoding='utf-8')
          weekly = """
          class _WeeklyProgressCard extends StatelessWidget {
            final AppState state;
            const _WeeklyProgressCard({required this.state});

            String _key(DateTime d) => '${d.year}-${d.month.toString().padLeft(2, '0')}-${d.day.toString().padLeft(2, '0')}';

            String _weekday(int weekday) {
              const names = <String>['', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت', 'الأحد'];
              return names[weekday];
            }

            @override
            Widget build(BuildContext context) {
              final now = DateTime.now();
              final monday = DateTime(now.year, now.month, now.day).subtract(Duration(days: now.weekday - DateTime.monday));
              final visibleDays = List.generate(7, (i) => monday.add(Duration(days: i))).reversed.toList();

              int progressFor(DateTime day) {
                final key = _key(day);
                if (key == _key(now)) {
                  final done = state.activePrayers.where((p) => state.todayStatus[p] == PrayerStatus.done).length;
                  return state.activePrayers.isEmpty ? 0 : ((done / state.activePrayers.length) * 100).round();
                }
                return state.dailyHistory[key] ?? 0;
              }

              final todayKey = _key(now);
              return Container(
                width: double.infinity,
                padding: const EdgeInsets.fromLTRB(12, 14, 12, 12),
                decoration: BoxDecoration(
                  color: AppColors.surfaceDark.withOpacity(.96),
                  borderRadius: BorderRadius.circular(22),
                  border: Border.all(color: AppColors.paperLine.withOpacity(.8)),
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Text('هذا الأسبوع', textAlign: TextAlign.right, style: GoogleFonts.amiri(fontSize: 22, fontWeight: FontWeight.w800, color: AppColors.ivory)),
                    const SizedBox(height: 10),
                    Row(
                      crossAxisAlignment: CrossAxisAlignment.end,
                      children: visibleDays.map((day) {
                        final isToday = _key(day) == todayKey;
                        final pct = progressFor(day);
                        return Expanded(
                          child: Padding(
                            padding: const EdgeInsets.symmetric(horizontal: 2),
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                Text(_weekday(day.weekday), maxLines: 1, overflow: TextOverflow.ellipsis, textAlign: TextAlign.center, style: GoogleFonts.cairo(fontSize: 8.5, fontWeight: isToday ? FontWeight.w800 : FontWeight.w600, color: isToday ? AppColors.gold : AppColors.textMuted)),
                                const SizedBox(height: 5),
                                Text('${day.day}', style: GoogleFonts.tajawal(fontSize: 11, fontWeight: FontWeight.w800, color: isToday ? AppColors.gold : AppColors.inkSoft)),
                                const SizedBox(height: 5),
                                Container(
                                  height: 78,
                                  width: double.infinity,
                                  decoration: BoxDecoration(
                                    color: AppColors.ink.withOpacity(.38),
                                    borderRadius: BorderRadius.circular(17),
                                    border: Border.all(color: isToday ? AppColors.gold.withOpacity(.9) : AppColors.paperLine.withOpacity(.55), width: isToday ? 1.5 : 1),
                                  ),
                                  alignment: Alignment.bottomCenter,
                                  padding: const EdgeInsets.all(3),
                                  child: Align(
                                    alignment: Alignment.bottomCenter,
                                    child: FractionallySizedBox(
                                      heightFactor: (pct / 100).clamp(0.0, 1.0),
                                      widthFactor: 1,
                                      child: DecoratedBox(decoration: BoxDecoration(color: AppColors.gold.withOpacity(.72), borderRadius: BorderRadius.circular(13))),
                                    ),
                                  ),
                                ),
                                const SizedBox(height: 6),
                                Text('$pct%', style: GoogleFonts.tajawal(fontSize: 9.5, fontWeight: FontWeight.w800, color: isToday ? AppColors.gold : AppColors.inkSoft)),
                              ],
                            ),
                          ),
                        );
                      }).toList(),
                    ),
                  ],
                ),
              );
            }
          }
          """
          if not re.search(r'class _WeeklyProgressCard extends StatelessWidget \{', s):
              raise SystemExit('WeeklyProgressCard not found')
          s = re.sub(r'class _WeeklyProgressCard extends StatelessWidget \{[\s\S]*\Z', weekly.strip() + '\n', s, count=1)
          p.write_text(s, encoding='utf-8')

          # Quran: use the embedded Uthmani dataset only; remove network fallback and generated verse suffixes.
          p = Path('lib/services/quran_service.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import 'dart:convert';\n\nimport 'package:http/http.dart' as http;\n", '', 1)
          s = re.sub(r"\n  static const _api = 'https://api\.alquran\.cloud/v1';[\s\S]*?\n  bool _isSajdaAyah", '\n  bool _isSajdaAyah', s, count=1)
          s = s.replace("text: '$cleanText ${_marker(ayah.surahNumber, ayah.id)}',", 'text: cleanText,', 1)
          s = re.sub(r"\n  QuranVerse\? _mapOnlineAyah[\s\S]*?\n  Future<QuranPage> fetchPage", '\n  Future<QuranPage> fetchPage', s, count=1)
          s = re.sub(r"\n  Future<QuranPage> fetchPage\(int page\) async \{[\s\S]*?\n  Future<List<QuranSurah>> fetchSurahs", """
          Future<QuranPage> fetchPage(int page) async {
            if (page < 1 || page > 604) throw ArgumentError.value(page, 'page', 'must be between 1 and 604');
            final ayahs = _offline.getPage(page);
            return QuranPage(page: page, verses: ayahs.map(_mapOfflineAyah).toList(growable: false));
          }

          Future<List<QuranSurah>> fetchSurahs""", s, count=1)
          s = re.sub(r"\n  Future<List<QuranSurah>> fetchSurahs\(\) async \{[\s\S]*?\n  Future<int> fetchSurahStartPage", """
          Future<List<QuranSurah>> fetchSurahs() async {
            return _offline.getAllSurahs().map((s) => QuranSurah(number: s.number, name: s.nameAr, englishName: s.nameEn, numberOfAyahs: s.ayahCount)).toList(growable: false);
          }

          Future<int> fetchSurahStartPage""", s, count=1)
          s = re.sub(r"\n  Future<int> fetchSurahStartPage\(int surahNumber\) async \{[\s\S]*?\n  Future<List<QuranSearchResult>> search", """
          Future<int> fetchSurahStartPage(int surahNumber) async {
            for (var page = 1; page <= 604; page++) {
              final ayahs = _offline.getPage(page);
              if (ayahs.any((ayah) => ayah.surahNumber == surahNumber)) return page;
            }
            throw Exception('Surah not found');
          }

          Future<List<QuranSearchResult>> search""", s, count=1)
          s = re.sub(r"\n  Future<List<QuranSearchResult>> search\(String keyword\) async \{[\s\S]*?\n  Future<QuranTafsir> fetchTafsir", """
          Future<List<QuranSearchResult>> search(String keyword) async {
            final query = keyword.trim();
            if (query.isEmpty) return const [];
            return _offline.search(query, limit: 50).map((ayah) => QuranSearchResult(verse: _mapOfflineAyah(ayah))).toList(growable: false);
          }

          Future<QuranTafsir> fetchTafsir""", s, count=1)
          p.write_text(s, encoding='utf-8')

          # Adhkar: individual play button directly on each dhikr card.
          p = Path('lib/screens/adhkar_flow_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("""                      Material(
                        color: Colors.transparent,
                        child: InkWell(
                          borderRadius: BorderRadius.circular(28),""", """                      Material(
                        color: Colors.transparent,
                        child: Stack(
                          children: [
                            InkWell(
                              borderRadius: BorderRadius.circular(28),""", 1)
          s = s.replace("""                          ),
                        ),
                      ),
                      const SizedBox(height: 20),""", """                            ),
                            Positioned(
                              top: 12,
                              left: 12,
                              child: Material(
                                color: AppColors.ink.withOpacity(.58),
                                shape: const CircleBorder(),
                                child: IconButton(
                                  tooltip: 'استماع',
                                  icon: const Icon(Icons.volume_up_rounded, color: AppColors.gold, size: 22),
                                  onPressed: () => AudioService.instance.playAsset(context, item.audioAsset(widget.audioCategory)),
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                      const SizedBox(height: 20),""", 1)
          s = re.sub(r"\n              Row\(\n                children: \[[\s\S]*?IconButton\(\n                    icon: const Icon\(Icons\.volume_up_rounded, color: AppColors\.gold\),\n                    tooltip: 'استماع',\n                    onPressed: \(\) => AudioService\.instance\.playAsset\(context, item\.audioAsset\(widget\.audioCategory\)\),\n                  \),\n                \],\n              \),", '', s, count=1)
          p.write_text(s, encoding='utf-8')

          # Remove the old "أضف ملفات الصوت..." instruction card.
          p = Path('lib/screens/adhkar_home_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"\n            const SizedBox\(height: 18\),\n            Container\(\n              padding: const EdgeInsets\.all\(15\),[\s\S]*?\n            \),\n          \],", '\n          ],', s, count=1)
          p.write_text(s, encoding='utf-8')

          # Audio service wording: missing audio is non-fatal and no longer asks the user to add files.
          p = Path('lib/services/audio_service.dart')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"///[\s\S]*?class AudioService", '/// Plays bundled local audio for individual adhkar.\nclass AudioService', s, count=1)
          s = s.replace("content: Text('لم يُضَف التسجيل الصوتي لهذا الذكر بعد'),", "content: Text('التسجيل الصوتي غير متوفر لهذا الذكر حاليًا'),", 1)
          p.write_text(s, encoding='utf-8')

          print('Aqim fixes applied')
          PY

      - name: Format and analyze
        run: |
          dart format lib/screens/home_screen.dart lib/screens/adhkar_flow_screen.dart lib/screens/adhkar_home_screen.dart lib/services/audio_service.dart lib/services/quran_service.dart
          flutter analyze --no-pub

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/home_screen.dart lib/screens/adhkar_flow_screen.dart lib/screens/adhkar_home_screen.dart lib/services/audio_service.dart lib/services/quran_service.dart
          git rm .github/workflows/apply-aqim-fixes.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix weekly days, offline Quran, and per-dhikr audio'
          git push
