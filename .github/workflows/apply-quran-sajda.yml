name: Apply Quran Sajda Patch
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/apply_quran_sajda.py
      - name: Verify patch
        run: |
          grep -q "bool get isSajda" lib/services/quran_service.dart
          grep -q "_showSajdaGuide" lib/screens/quran_screen.dart
          grep -q "verse.isSajda" lib/screens/quran_screen.dart
      - name: Commit patch and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/quran_service.dart lib/screens/quran_screen.dart .github/quran-sajda-applied.txt tools/apply_quran_sajda.py .github/workflows/apply-quran-sajda.yml
          git rm .github/workflows/apply-quran-sajda.yml
          git commit -m 'feat: add Quran sajda markers and guide'
          git push
