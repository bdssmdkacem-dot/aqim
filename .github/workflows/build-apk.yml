name: Build Aqim Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply Aqim branding and Quran navigation fixes
        run: python3 scripts/apply_aqim_branding.py && python3 scripts/apply_quran_and_logo_fixes.py

      - name: Apply Aqim notification preferences
        run: python3 scripts/apply_pre_prayer_notification_settings.py

      - name: Apply persistent pre-prayer alarm fix
        run: |
          if grep -q "static const MethodChannel _nativeAdhanChannel" lib/services/notification_service.dart; then
            echo "Persistent native Adhan patch already applied; skipping re-application."
          else
            python3 scripts/apply_persistent_pre_prayer_alarm.py
          fi

      - name: Download and verify Tanzil Uthmani Quran
        run: python3 scripts/download_tanzil_uthmani.py

      - name: Download and verify offline Hafs and Warsh Mushaf pages
        run: python3 scripts/download_maknoon_mushaf_pages.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release compile fixes
        run: python3 scripts/prepare_release_compile_fixes.py

      - name: Ensure AppState exposes safe notification method
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/state/app_state.dart')
          text = path.read_text()
          marker = '  void notifyAppStateChanged() => notifyListeners();\n'
          if marker not in text:
              needle = 'class AppState extends ChangeNotifier {\n'
              if needle not in text:
                  raise SystemExit('AppState class marker not found; refusing partial patch.')
              text = text.replace(needle, needle + marker, 1)
              path.write_text(text)
              print('Added safe AppState notification method.')
          else:
              print('Safe AppState notification method already present.')
          PY

      - name: Clean analyzer warnings
        run: python3 scripts/cleanup_analyzer_warnings.py

      - name: Format Dart sources
        run: dart format lib test

      - name: Persist generated and formatted Dart changes
        run: |
          if git diff --quiet -- lib test; then
            echo "No generated or formatting changes to persist."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "chore(ci): persist generated Dart formatting [skip ci]"
            git push
          fi

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/flutter-analyze.log
          status=${PIPESTATUS[0]}
          echo "Flutter analyze exit code: $status"
          echo "=== analyzer errors ==="
          grep -nE '(^| )error •|^error |ERROR' /tmp/flutter-analyze.log || true
          echo "=== analyzer warnings ==="
          grep -nE '(^| )warning •|^warning |WARNING' /tmp/flutter-analyze.log || true
          echo "=== analyzer infos ==="
          grep -nE '(^| )info •|^info ' /tmp/flutter-analyze.log | tail -n 20 || true
          if grep -qE '(^| )error •|^error |ERROR' /tmp/flutter-analyze.log; then
            echo "Analyzer errors detected; failing CI."
            exit 1
          fi
          if grep -qE '(^| )warning •|^warning |WARNING' /tmp/flutter-analyze.log; then
            echo "Analyzer warnings detected; failing CI."
            exit 1
          fi
          echo "Analyzer contains no errors or warnings; info diagnostics are non-fatal."
          exit 0

      - name: Flutter Test
        run: flutter test

      - name: Verify Quran and Mushaf assets
        run: |
          test -f assets/quran/tanzil_uthmani.json
          test -d assets/mushaf/hafs
          test -d assets/mushaf/warsh

      - name: Verify Aqim logo
        run: test -f assets/images/branding/aqim_logo.png

      - name: Restore Android release keystore
        env:
          AQIM_UPLOAD_KEYSTORE_BASE64: ${{ secrets.AQIM_UPLOAD_KEYSTORE_BASE64 }}
          AQIM_KEYSTORE_PASSWORD: ${{ secrets.AQIM_KEYSTORE_PASSWORD }}
          AQIM_KEY_ALIAS: ${{ secrets.AQIM_KEY_ALIAS }}
          AQIM_KEY_PASSWORD: ${{ secrets.AQIM_KEY_PASSWORD }}
        run: |
          if [ -z "$AQIM_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "AQIM_UPLOAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          mkdir -p android/app
          echo "$AQIM_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$AQIM_KEYSTORE_PASSWORD
          keyPassword=$AQIM_KEY_PASSWORD
          keyAlias=$AQIM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aqim-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
