name: Verify Aqim APK

on:
  push:
    branches:
      - fix/adhan-notification-path
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Quran assets
        run: |
          python3 scripts/download_tanzil_uthmani.py
          python3 scripts/download_maknoon_mushaf_pages.py

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter Test
        run: flutter test

      - name: Verify Quran and Mushaf assets
        run: |
          test -f assets/quran/quran-uthmani.txt
          test -d assets/quran/hafs/pages
          test -d assets/quran/warsh/pages
          test "$(find assets/quran/hafs/pages -type f -name '*.png' | wc -l)" -eq 604
          test "$(find assets/quran/warsh/pages -type f -name '*.png' | wc -l)" -eq 604

      - name: Verify Android Adhan assets
        run: |
          test -d assets/adhan
          find assets/adhan -maxdepth 1 -type f -name '*.mp3' -print
          test "$(find assets/adhan -maxdepth 1 -type f -name '*.mp3' | wc -l)" -ge 1

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK output
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aqim-adhan-path-apk
          path: build/app/outputs/flutter-apk/app-release.apk
