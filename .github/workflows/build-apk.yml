name: Build Aqim Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply Aqim branding
        run: python3 scripts/apply_aqim_branding.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Verify signing files
        run: |
          ls -lah android
          test -f android/upload-keystore.jks
          test -f android/key.properties

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aqim-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aqim-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
