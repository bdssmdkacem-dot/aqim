name: Build Aqim Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply Aqim branding and Quran navigation fixes
        run: python3 scripts/apply_aqim_branding.py && python3 scripts/apply_quran_and_logo_fixes.py

      - name: Apply Aqim notification preferences
        run: python3 scripts/apply_pre_prayer_notification_settings.py

      - name: Apply persistent pre-prayer alarm fix
        run: python3 scripts/apply_persistent_pre_prayer_alarm.py

      - name: Download and verify Tanzil Uthmani Quran
        run: python3 scripts/download_tanzil_uthmani.py

      - name: Download and verify offline Hafs and Warsh Mushaf pages
        run: python3 scripts/download_maknoon_mushaf_pages.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare release compile fixes
        run: python3 scripts/prepare_release_compile_fixes.py

      - name: Verify Quran asset
        run: |
          test -f assets/quran/quran-uthmani.txt
          python3 - <<'PY'
          from pathlib import Path
          lines = [x for x in Path('assets/quran/quran-uthmani.txt').read_text(encoding='utf-8-sig').splitlines() if x.strip()]
          assert len(lines) == 6236, f'Expected 6236 ayat, got {len(lines)}'
          assert lines[0].startswith('1|1|')
          assert lines[-1].startswith('114|6|')
          print(f'Quran verification passed: {len(lines)} ayat')
          PY

      - name: Verify offline Mushaf pages
        run: |
          test "$(find assets/quran/hafs/pages -type f -name '*.png' | wc -l)" -eq 604
          test "$(find assets/quran/warsh/pages -type f -name '*.png' | wc -l)" -eq 604
          test -f assets/quran/hafs/pages/001.png
          test -f assets/quran/hafs/pages/604.png
          test -f assets/quran/warsh/pages/001.png
          test -f assets/quran/warsh/pages/604.png
          echo "Verified 604 Hafs pages + 604 Warsh pages"

      - name: Verify exact Aqim logo
        run: test -f android/app/src/main/res/drawable/aqim_logo_transparent_512.png

      - name: Restore Android keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Verify signing files
        run: |
          ls -lah android
          test -f android/upload-keystore.jks
          test -f android/key.properties

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aqim-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aqim-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
