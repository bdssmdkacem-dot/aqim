name: Build Aqim Closed Alpha AAB

on:
  push:
    branches:
      - fix/adhan-notification-path
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Quran assets
        run: |
          python3 scripts/download_tanzil_uthmani.py
          python3 scripts/download_maknoon_mushaf_pages.py

      - name: Apply exact Aqim branding
        run: python3 scripts/apply_quran_and_logo_fixes.py

      - name: Verify exact Aqim branding resources
        run: |
          test -s assets/images/aqim_logo_transparent_512.png
          test -s android/app/src/main/res/drawable/aqim_logo_transparent_512.png
          test -s android/app/src/main/res/drawable/ic_aqim_logo.png
          test -s android/app/src/main/res/drawable/ic_aqim_notification.png
          test ! -e android/app/src/main/res/drawable/ic_aqim_logo.xml
          grep -q 'R.drawable.aqim_logo_transparent_512' android/app/src/main/kotlin/com/aqim/app/AdhanAlarmService.kt
          grep -q 'R.drawable.aqim_logo_transparent_512' android/app/src/main/kotlin/com/aqim/app/PrePrayerAlarmService.kt

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter Test
        run: flutter test

      - name: Verify Quran and Mushaf assets
        run: |
          test -f assets/quran/quran-uthmani.txt
          test -d assets/quran/hafs/pages
          test -d assets/quran/warsh/pages
          test "$(find assets/quran/hafs/pages -type f -name '*.png' | wc -l)" -eq 604
          test "$(find assets/quran/warsh/pages -type f -name '*.png' | wc -l)" -eq 604

      - name: Verify Android Adhan assets
        run: |
          test -d assets/adhan
          find assets/adhan -maxdepth 1 -type f -name '*.mp3' -print
          test "$(find assets/adhan -maxdepth 1 -type f -name '*.mp3' | wc -l)" -ge 1

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify AAB output
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aqim-closed-alpha-aab
          path: build/app/outputs/bundle/release/app-release.aab
