name: Fix Fajr premature missed status

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix AppState prayer status logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/state/app_state.dart')
          s = p.read_text()
          old = '''  void _recomputeUpcoming() {
    final now = DateTime.now();
    var missedChanged = false;
    Prayer? nextToday;

    // A prayer is today's upcoming prayer only while its time is still in the future.
    for (final prayer in activePrayers) {
      final t = _timeFor(prayer);
      if (t == null) continue;
      if (t.isAfter(now)) {
        nextToday = prayer;
        break;
      }
    }

    for (final prayer in activePrayers) {
      final status = todayStatus[prayer];
      if (status == PrayerStatus.done || status == PrayerStatus.missed) continue;

      final t = _timeFor(prayer);
      final elapsed = t != null && !t.isAfter(now);

      if (prayer == nextToday) {
        todayStatus[prayer] = PrayerStatus.upcoming;
        continue;
      }

      if (elapsed) {
        todayStatus[prayer] = PrayerStatus.missed;
        missTally[prayer] = (missTally[prayer] ?? 0) + 1;
        missedChanged = true;
      } else {
        todayStatus[prayer] = PrayerStatus.pending;
      }
    }

    if (missedChanged) {
      unawaited(_persist());
      unawaited(_persistMissTally());
    }
  }
'''
          new = '''  void _recomputeUpcoming() {
    final now = DateTime.now();
    var missedChanged = false;
    Prayer? nextToday;

    // Recompute from the actual prayer time every time. A persisted `missed`
    // state must never survive when the prayer time is still in the future.
    for (final prayer in activePrayers) {
      final t = _timeFor(prayer);
      if (t != null && t.isAfter(now)) {
        nextToday = prayer;
        break;
      }
    }

    for (final prayer in activePrayers) {
      final previous = todayStatus[prayer];
      if (previous == PrayerStatus.done) continue;

      final t = _timeFor(prayer);
      if (t == null) {
        todayStatus[prayer] = PrayerStatus.pending;
        continue;
      }

      if (t.isAfter(now)) {
        todayStatus[prayer] = prayer == nextToday
            ? PrayerStatus.upcoming
            : PrayerStatus.pending;
        continue;
      }

      // Only mark a prayer missed after its real local time has passed.
      // This also clears an old/stale `missed` value if the time is still future.
      if (previous != PrayerStatus.missed) {
        missTally[prayer] = (missTally[prayer] ?? 0) + 1;
        missedChanged = true;
      }
      todayStatus[prayer] = PrayerStatus.missed;
    }

    if (missedChanged) {
      unawaited(_persist());
      unawaited(_persistMissTally());
    }
  }
'''
          if old not in s:
              raise SystemExit('Expected _recomputeUpcoming block was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/state/app_state.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Fajr being marked missed before its time [skip ci]'
          git push
