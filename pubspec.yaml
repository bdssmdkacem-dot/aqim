name: aqim
description: "Aqim — Personal Prayer Habit Coach"
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  audioplayers: ^6.7.1
  google_mobile_ads: ^5.3.1
  http: ^1.6.0
  geolocator: ^13.0.4
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.1
  flutter_timezone: ^4.1.1
  disable_battery_optimization: ^1.1.2
  url_launcher: ^6.3.2
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/before/
    - assets/audio/after/    - assets/audio/before/
    - assets/audio/after/
